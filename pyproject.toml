[project]
name = "scottymcp"
version = "0.1.0"
description = "MCP Server for ÖBB (Austrian Federal Railways) providing real-time train schedules, station information, and connection data"
authors = [
    {name = "ScottyMCP Contributors"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "mcp>=1.2.0",
    "pyhafas>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
